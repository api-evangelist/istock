description: >-
  iStock partner API requests run on Getty's platform and inherit Getty's per-API-key QPS limits.
  Specific thresholds are contract-defined; HTTP 429 indicates 'Account Over Queries Per Second
  Limit.'
notes: Inherits Getty's per-key QPS limits; not separately documented for iStock.
sources:
- https://developer.gettyimages.com/docs/
responseCodes:
  throttled: 429
limits:
- name: Per API key
  scope: account
  metric: requests-per-second
  limit: contract-defined
  notes: Returns 'Account Over Queries Per Second Limit' on overage.
policies:
- name: Backoff Strategy
  description: On 429, apply exponential backoff with jitter.
- name: Caching
  description: Cache search/metadata responses to minimize repeat traffic.
