specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: iStock
providerId: istock
created: '2026-05-08'
modified: '2026-05-08'
reconciled: true
tags:
- Stock Media
- Images
- Video
- Illustrations
- Royalty-Free
- Getty
- FinOps
- Cost Management
- FOCUS
description: >-
  FOCUS-aligned FinOps profile for iStock. Cost is driven by credit-pack purchases and/or monthly
  subscription downloads. For consumers/SMB this is direct on iStock.com; for API partners cost flows
  through the Getty enterprise contract. Optimize by matching subscription size to download cadence
  and avoiding mid-cycle credit top-ups.
notes: "Two cost paths: consumer/SMB on iStock.com vs. enterprise API via Getty contract."
sources:
- https://www.istockphoto.com/plans-and-pricing
- https://focus.finops.org/focus-specification/v1-3/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Getty Images / iStock
serviceCategory: Stock Media
billingModel:
  pricingCategory: Subscription + Credits
  billingFrequency: Monthly / Annual
  billingCurrency: USD
  chargeCategories:
  - Subscription
  - Purchase
focusColumns:
  ServiceName: iStock
  ServiceCategory: Stock Media
  ProviderName: Getty Images
  PublisherName: iStock
  InvoiceIssuerName: iStock
  BillingCurrency: USD
  ChargeCategory: Subscription
meters:
- name: downloads
  description: Asset downloads consumed against subscription or credit pack.
  unit: download
  aggregation: sum
  dimensions:
  - collection
  - asset_type
- name: credit_packs
  description: One-time credit pack purchases.
  unit: pack
  aggregation: sum
  dimensions:
  - pack_size
principles:
- name: Visibility
  description: Pull download history from iStock dashboard or API.
- name: Allocation
  description: Allocate downloads to consuming brand/team.
- name: Optimization
  description: Choose subscription over credit packs when monthly cadence is steady; avoid Signature collection unless required.
- name: Accountability
  description: Creative team owns the iStock subscription.
maintainers:
- FN: Kin Lane
  email: kin@apievangelist.com
