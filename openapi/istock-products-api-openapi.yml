openapi: 3.2.0
info:
  title: Getty Images Products API
  version: '3'
security:
- Api-Key: []
- OAuth2: []
tags:
- name: Products
paths:
  /v3/products:
    get:
      tags:
      - Products
      summary: Get Products
      description: 'This endpoint returns all products available to the username used during authentication. As such, this endpoint requires the use of

        a fully authorized access_token. The product data can then be used as search filters, restricting results to images from a specific product.


        You''ll need an API key and access token to use this resource.'
      parameters:
      - name: Accept-Language
        in: header
        description: 'Provide a header to specify the language of result values. Supported values: cs (iStock only), de, en-GB, en-US, es, fi (iStock only), fr, hu (iStock only), id (iStock only), it, ja, ko (creative assets only), nl, pl (creative assets only), pt-BR, pt-PT, ro (iStock only), ru (creative assets only), sv, th (iStock only), tr, uk (iStock only), vi (iStock only), zh-HK (creative assets only).'
        schema:
          type: string
          description: 'Provide a header to specify the language of result values. Supported values: cs (iStock only), de, en-GB, en-US, es, fi (iStock only), fr, hu (iStock only), id (iStock only), it, ja, ko (creative assets only), nl, pl (creative assets only), pt-BR, pt-PT, ro (iStock only), ru (creative assets only), sv, th (iStock only), tr, uk (iStock only), vi (iStock only), zh-HK (creative assets only).'
      - name: fields
        in: query
        description: Comma separated list of fields. Allows product download requirements to be returned.
        style: form
        explode: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/GettyImages.Services.Connect.Public.Controllers.Products.ProductFieldValues'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GettyImages.Services.Connect.Public.Models.Products.ProductsResult'
        '401':
          description: Unauthorized
        '400':
          description: InvalidRequestParameters
        '500':
          description: CreditPack
      operationId: getV3Products
      x-operation-id-source: derived
components:
  schemas:
    GettyImages.Services.Connect.Public.Models.ProductStatus:
      enum:
      - active
      - inactive
      type: string
    GettyImages.Services.Connect.Public.Models.Products.Product:
      type: object
      properties:
        application_website:
          type:
          - string
          - 'null'
        credits_remaining:
          type:
          - integer
          - 'null'
          format: int32
        download_limit:
          type:
          - integer
          - 'null'
          format: int32
        download_limit_duration:
          type:
          - string
          - 'null'
        download_limit_reset_utc_date:
          type:
          - string
          - 'null'
          format: date-time
        downloads_remaining:
          type:
          - integer
          - 'null'
          format: int32
        expiration_utc_date:
          type:
          - string
          - 'null'
          format: date-time
        id:
          type: integer
          format: int32
        name:
          type:
          - string
          - 'null'
        status:
          $ref: '#/components/schemas/GettyImages.Services.Connect.Public.Models.ProductStatus'
        type:
          $ref: '#/components/schemas/GettyImages.Services.Connect.Public.Models.ProductTypeResponse'
        ai_gen_requirements:
          $ref: '#/components/schemas/GettyImages.Services.Connect.Public.Models.Products.DownloadRequirements'
        download_requirements:
          $ref: '#/components/schemas/GettyImages.Services.Connect.Public.Models.Products.DownloadRequirements'
        overage:
          $ref: '#/components/schemas/GettyImages.Services.Connect.Public.Models.Products.OverageDetails'
        agreement_name:
          type:
          - string
          - 'null'
        imagepack_resolution:
          type:
          - string
          - 'null'
        team_credits:
          type:
          - integer
          - 'null'
          format: int32
      additionalProperties: false
    GettyImages.Services.Connect.Public.Models.ProductTypeResponse:
      enum:
      - easyaccess
      - editorialsubscription
      - imagepack
      - premiumaccess
      - royaltyfreesubscription
      - creditpack
      - aigen
      type: string
    GettyImages.Services.Connect.Public.Models.Products.OverageDetails:
      type: object
      properties:
        limit:
          type:
          - integer
          - 'null'
          format: int32
        remaining:
          type:
          - integer
          - 'null'
          format: int32
        count:
          type:
          - integer
          - 'null'
          format: int32
        overages_reached:
          type:
          - boolean
          - 'null'
      additionalProperties: false
    GettyImages.Services.Connect.Public.Models.Products.ProductsResult:
      type: object
      properties:
        products:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/GettyImages.Services.Connect.Public.Models.Products.Product'
      additionalProperties: false
    GettyImages.Services.Connect.Public.Models.Products.DownloadRequirements:
      type: object
      properties:
        is_note_required:
          type: boolean
        is_project_code_required:
          type: boolean
        project_codes:
          type:
          - array
          - 'null'
          items:
            type: string
      additionalProperties: false
    GettyImages.Services.Connect.Public.Controllers.Products.ProductFieldValues:
      enum:
      - download_requirements
      type: string
  securitySchemes:
    Api-Key:
      type: apiKey
      name: Api-Key
      in: header
    OAuth2:
      type: oauth2
      flows:
        password:
          tokenUrl: https://authentication.gettyimages.com/oauth2/token
          refreshUrl: https://authentication.gettyimages.com/oauth2/token
          scopes: {}
        clientCredentials:
          tokenUrl: https://authentication.gettyimages.com/oauth2/token
          scopes: {}
        authorizationCode:
          authorizationUrl: https://authentication.gettyimages.com/oauth2/auth
          tokenUrl: https://authentication.gettyimages.com/oauth2/token
          refreshUrl: https://authentication.gettyimages.com/oauth2/token
          scopes: {}
x-provenance:
  method: harvested
  publisher: iStock
  source: https://api.gettyimages.com/swagger/v3/swagger.json
