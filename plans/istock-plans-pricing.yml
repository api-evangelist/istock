specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: iStock
providerId: istock
created: '2026-05-08'
modified: '2026-05-08'
reconciled: true
tags:
- Stock Media
- Images
- Video
- Illustrations
- Royalty-Free
- Getty
- Plans
description: >-
  iStock sells consumer/SMB plans (credit packs and monthly subscriptions for Essentials and Signature
  collections) directly on iStockphoto.com. API access is not part of consumer plans; partner API
  access (running on the Getty platform) requires a Getty enterprise licensing agreement.
notes: Consumer plans on iStock.com (credits/subscriptions); API access is enterprise-only via Getty's developer program.
sources:
- https://www.istockphoto.com/plans-and-pricing
- https://developer.gettyimages.com/
plans:
- id: istock-credit-packs
  name: iStock Credit Packs
  type: paid
  description: Pre-paid credits redeemed for individual asset downloads (Essentials or Signature).
  entries:
  - label: Credits
    name: credits
    type: flat
    metric: credit
    limit: -1
    timeFrame: one-time
    geo: global
    unit: 1
    price: see https://www.istockphoto.com/plans-and-pricing
    userMultiplied: false
  elements:
  - name: Essentials and Signature collections
  - name: Per-asset credit cost varies
- id: istock-subscription
  name: iStock Subscription
  type: subscription
  description: Monthly/annual subscription with a fixed download allowance per month.
  entries:
  - label: Subscription
    name: subscription
    type: flat
    metric: month
    limit: -1
    timeFrame: monthly
    geo: global
    unit: 1
    price: see https://www.istockphoto.com/plans-and-pricing
    userMultiplied: false
  elements:
  - name: Fixed monthly downloads
  - name: Tiers for Essentials and Signature
- id: istock-api-partner
  name: API Partner (Getty Platform)
  type: enterprise
  description: Partner API access requires a Getty enterprise licensing agreement; no self-serve API plan.
  entries:
  - label: API License
    name: api_license
    type: flat
    metric: year
    limit: -1
    timeFrame: annual
    geo: global
    unit: 1
    price: contact sales
    userMultiplied: false
  elements:
  - name: Getty platform API access
  - name: Contract-defined entitlements
maintainers:
- FN: Kin Lane
  email: kin@apievangelist.com
